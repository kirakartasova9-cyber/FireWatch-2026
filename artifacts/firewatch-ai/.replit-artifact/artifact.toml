kind = "web"
previewPath = "/"
title = "kes beaux innovateisses"
description = "Русскоязычный учебный прототип для демонстрации мониторинга лесных пожаров: показывает данные станций, уровни риска, графики, карту и журнал предупреждений. Не предназначен для обнаружения реальных пожаров."
version = "1.0.0"
id = "artifacts/firewatch-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23594

[services.development]
run = "pnpm --filter @workspace/firewatch-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/firewatch-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/firewatch-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23594"
BASE_PATH = "/"
